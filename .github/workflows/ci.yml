name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Backend: .NET 8
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (dotnet build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FileShareSystem/FileShareAPI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/FileShareAPI.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish --no-build -c Release -o publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish-${{ github.sha }}
          path: FileShareSystem/FileShareAPI/publish
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Frontend: Vue 3 + TypeScript
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FileShareSystem/vue-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FileShareSystem/vue-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: FileShareSystem/vue-frontend/dist
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Docker build validation (no push)
  # ──────────────────────────────────────────────────────────────────
  docker-validate:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./FileShareSystem/FileShareAPI
          push: false
          tags: fileshare-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./FileShareSystem/vue-frontend
          push: false
          tags: fileshare-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
