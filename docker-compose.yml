services:
  # ─── Backend (.NET 8 API) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./FileShareSystem/FileShareAPI
      dockerfile: Dockerfile
    container_name: fileshare-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/fileshare.db
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-FileShareAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-FileShareUsers}
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-1440}
      - FileStorage__UploadPath=/data/uploads
      - FileStorage__MaxFileSize=${MAX_FILE_SIZE:-524288000}
    volumes:
      - app_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (Vue 3 + Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./FileShareSystem/vue-frontend
      dockerfile: Dockerfile
    container_name: fileshare-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  app_data:
    driver: local

networks:
  app_network:
    driver: bridge
